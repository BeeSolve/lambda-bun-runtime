name: publish-smoke

# Publishes the runtime to one region with a throwaway version and alias, to check the
# publish role, the AWS CLI and the Docker build. Not public, nothing goes to npm.
on:
  workflow_dispatch: {}
  push:
    branches: [feat/v4-public-artifacts]
    paths: [".github/workflows/publish-smoke.yml"]

jobs:
  publish-runtime:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Install the latest AWS CLI
        run: |
          curl -sSf https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Publish the runtime
        run: |
          bun command/publishRuntime.ts \
            --region eu-central-1 \
            "$(cat .bun-version)" \
            --version-name smoke-${{ github.run_id }} \
            --alias smoke-${{ github.run_id }} \
            --out runtime-result.json
          cat runtime-result.json
