name: integration

on:
  workflow_call:
    inputs:
      published-layer:
        description: "Deploy the published layer (artifacts.json from the release run) instead of a layer built from source"
        type: boolean
        default: false
  workflow_dispatch: {}
  pull_request:
    paths:
      - "command/**"
      - "src/**"
      - "examples/sample-app/**"
      - "test/integration/**"
      - ".github/workflows/integration.yml"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-test-destroy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_INTEG_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: bun install --frozen-lockfile

      - name: Use the published layer
        if: inputs.published-layer
        uses: actions/download-artifact@v8
        with:
          name: artifacts-json-first-region
          path: src

      - name: Build the layer from source
        if: ${{ !inputs.published-layer }}
        run: |
          bun run build:layer
          echo "BUN_LAYER_ZIP=$PWD/lib/bun-lambda-layer-$(cat .bun-version).zip" >> "$GITHUB_ENV"

      # PR runs have no fresh release, so the CMR echo function points at the runtime published
      # by the latest GitHub release instead of the stack's region lookup.
      - name: Resolve the published runtime for PR runs
        if: ${{ !inputs.published-layer }}
        run: |
          curl -sSfL -o /tmp/artifacts.json \
            https://github.com/${{ github.repository }}/releases/latest/download/artifacts.json
          echo "BUN_RUNTIME_ARN=$(jq -r '.regions["eu-central-1"].runtimeArn' /tmp/artifacts.json)" >> "$GITHUB_ENV"
          echo "BUN_RUNTIME_ALIAS=$(jq -r '.regions["eu-central-1"].runtimeAlias' /tmp/artifacts.json)" >> "$GITHUB_ENV"

      - run: bun run build

      - run: bun run integ:deploy-test-destroy

      - name: Cleanup leftover stacks
        if: always()
        run: bun run integ:cleanup
